name: NovaEnterprise CI Pipeline

on:
  push:
    branches:
      - development
      - testing
      - main
  pull_request:
    branches:
      - development
      - testing
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend Lint, Test & Evaluation Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff static analysis
        run: |
          ruff check backend/ tests/ rag/ agents/

      - name: Run Mypy static type checking
        run: |
          mypy backend/app tests/ rag/ agents/

      - name: Run full offline integration test suite (make test)
        env:
          LLM_PROVIDER: fake
          VECTOR_STORE: memory
          GRAPH_STORE: memory
          USE_FAKEREDIS: "true"
        run: |
          pytest tests/unit/ tests/api/ tests/evaluation/ tests/integration/ -v

      - name: Run CI evaluation harness (make eval)
        env:
          LLM_PROVIDER: fake
          VECTOR_STORE: memory
          GRAPH_STORE: memory
          USE_FAKEREDIS: "true"
        run: |
          python -m tests.evaluation.evaluate

  frontend-lint-test:
    name: Frontend Lint, Type-Check & Build Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint

      - name: Run TypeScript type checking
        run: |
          npm run type-check

      - name: Run Vitest unit suite
        run: |
          npm test

      - name: Verify standalone production build
        run: |
          npm run build

  containers-ci:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose config -q

      - name: Build Backend Docker image
        run: |
          docker build -f Dockerfile.backend -t nova-backend:ci .

      - name: Build Frontend Docker image
        run: |
          docker build -f Dockerfile.frontend -t nova-frontend:ci .
