# ==============================================================================
# NovaEnterprise Multi-Service Docker Compose Stack (P14-4)
# ==============================================================================
# Full topology combining:
#   - Relational SQL Store:   PostgreSQL 16 (database schema, RLS, audit logs)
#   - Cache / Memory Store:   Redis 7 (rate limiting token bucket, session cache)
#   - Vector Store:           Qdrant v1.12 (dense vector embeddings & hybrid RAG)
#   - Graph Store:            Neo4j 5.26 (typed Cypher traversals & knowledge graph)
#   - Application Server:     FastAPI + LangGraph multi-agent orchestrator (:8001)
#   - Enterprise UI:          Next.js 15 standalone console shell (:3001)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_enterprise}
      POSTGRES_USER: ${POSTGRES_USER:-nova_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_user} -d ${POSTGRES_DB:-nova_enterprise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nova-network

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nova-network

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: nova-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nova-network

  neo4j:
    image: neo4j:5.26-community
    container_name: nova-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/nova_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - nova-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nova-backend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      DATABASE_URL: ${DATABASE_URL:-postgresql://nova_user:nova_password@postgres:5432/nova_enterprise}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_FAKEREDIS: "false"
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      GRAPH_STORE: ${GRAPH_STORE:-neo4j}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nova_neo4j_password}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-nova-enterprise-development-jwt-secret-do-not-use-in-production}
      RATE_LIMIT_PER_MINUTE: "120"
      MAX_UPLOAD_MB: "5"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://frontend:3001"]'
    ports:
      - "8001:8001"
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nova-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nova-frontend
    restart: unless-stopped
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "production"
      BACKEND_URL: ${BACKEND_URL:-http://backend:8001}
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nova-network

volumes:
  postgres-data:
    name: nova-postgres-data
  redis-data:
    name: nova-redis-data
  qdrant-data:
    name: nova-qdrant-data
  neo4j-data:
    name: nova-neo4j-data
  backend-data:
    name: nova-backend-data

networks:
  nova-network:
    name: nova-network
    driver: bridge
